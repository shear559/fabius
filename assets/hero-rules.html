<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fabius — one set of rules above every model</title>
<style>
/* Static source for hero-rules.webp. Uses the landing page's color tokens. */
:root{--canvas:#fafbf7;--ink:#15131b;--muted:#686574;--primary:#76b900;--primary-strong:#5e9400;--primary-ink:#4e7a00;--tint:#f1f7e1;--canvas-ink:#090811}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--canvas);color:var(--ink)}
.hero{width:1984px;height:794px;padding:72px 96px;background:radial-gradient(ellipse at 9% 0%,var(--tint),transparent 48%),var(--canvas);display:flex;flex-direction:column;justify-content:space-between}
header{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:24px;font-size:42px;font-weight:750;letter-spacing:-1.5px}
.brand svg{width:52px;height:52px;color:var(--primary)}
.label{font:700 19px ui-monospace,"SF Mono",monospace;letter-spacing:2px;color:var(--primary-ink)}
h1{font-size:108px;line-height:1.09;letter-spacing:-5px;margin:0;font-weight:760}
h1 span{display:block;color:var(--primary-strong)}
.method{display:flex;align-items:center;gap:36px}
.steps{background:var(--canvas-ink);color:var(--canvas);padding:28px 36px;font:600 29px ui-monospace,"SF Mono",monospace;white-space:nowrap}
.steps span{color:var(--primary);padding:0 12px}
.models{display:flex;align-items:center;gap:16px}
.models img{width:54px;height:54px;border-radius:12px;object-fit:contain}
footer{font-size:24px;line-height:1.5;color:var(--muted)}
footer b{color:var(--ink)}
@media(max-width:1300px){.hero{width:1200px;height:630px;padding:48px 60px}.brand{font-size:34px;gap:16px}.brand svg{width:44px;height:44px}.label{font-size:14px;letter-spacing:1px}h1{font-size:78px;letter-spacing:-3px}.method{gap:24px}.steps{font-size:21px;padding:22px 24px}.steps span{padding:0 7px}.models{gap:12px}.models img{width:40px;height:40px}footer{font-size:20px}}
</style>
<main class="hero">
  <header>
    <div class="brand"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 50 L61 50 L61 39 L39 39 L39 61 L72 61 L72 28 L28 28 L28 72 L83 72 L83 17 L17 17" fill="none" stroke="currentColor" stroke-width="5.5"/><circle cx="50" cy="50" r="3.1" fill="currentColor"/></svg>fabius</div>
    <div class="label">OPERATING RULES FOR AI MODELS</div>
  </header>
  <h1>one set of rules.<span>above every model.</span></h1>
  <div class="method">
    <div class="steps">plan<span>→</span>act<span>→</span>verify<span>→</span>remember</div>
    <div class="models" aria-label="Examples of model families; host support varies">
      <img src="brands/s/anthropic.webp" alt="Claude"><img src="brands/s/openai.webp" alt="GPT"><img src="brands/gemini.svg" alt="Gemini"><img src="brands/s/deepseek.webp" alt="DeepSeek"><img src="brands/s/qwen.webp" alt="Qwen"><img src="brands/s/llama.webp" alt="Llama"><img src="brands/s/mistral.webp" alt="Mistral"><img src="brands/s/xai.webp" alt="Grok">
    </div>
  </div>
  <footer><b>15 skills · 22 core routing rules.</b> Use your chosen model through a compatible agent app.</footer>
</main>
</html>
