<title id="t">How every Fabius task runs: a six-step loop</title>
<desc id="d">Sense, read the project record and the code first. Classify, name what the task needs and ask only what changes the outcome. Route, pick the skills, the machinery rung and the model tier. Strike, make the smallest correct change. Prove, run it and show the evidence. Compound, file the verified lesson with your permission. Scout wide, strike narrow; then the loop closes and the next task starts ahead.</desc>
