<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 572" width="840" height="572" role="img" aria-labelledby="t d">
<title id="t">The machinery ladder: Fabius adds capability one rung at a time and stops at the first that holds</title>
<desc id="d">Six rungs: answer inline, one tool call, retrieval, a written plan, a single subagent, a swarm. In the example, answering inline was tried and was not enough, one tool call held, so Fabius stopped; retrieval, a plan, a subagent and a swarm were never started. The rule: never start the next rung until this one is shown insufficient on this task. This is a diagram of the rule, not a measurement.</desc>
