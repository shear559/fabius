name: Bug report
description: Something the runtime, a skill contract or the docs did wrong
labels: [bug]
body:
  - type: input
    id: surface
    attributes:
      label: Where
      description: Host name/version and plugin-manager version. For the optional runner from a full checkout, include `node runtime/fabius.mjs --version`.
      placeholder: Claude Code · fabius v3.2.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you ran, what you expected, what happened
      description: The three things that turn a maybe into a fix
    validations:
      required: true
  - type: textarea
    id: receipts
    attributes:
      label: Receipts
      description: Output, transcript excerpt, or the incorrect documentation. Manually remove secrets and personal information before sharing. Report possible secret exposure privately through SECURITY.md; do not paste it here.
